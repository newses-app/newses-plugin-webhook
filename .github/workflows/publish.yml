# Publishes the package to npm when a version tag (v1.2.3) is pushed, with provenance, through
# npm trusted publishing: configure this repository and workflow as the package's trusted
# publisher on npmjs.com once, after the first version is published by hand. No token is stored.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag is the package's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm publish --access public --provenance
